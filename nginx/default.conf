server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite output files are content-hashed, so they can be cached for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Never cache the HTML shell, so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app fallback for vue-router history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }
}